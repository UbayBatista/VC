__include__:
- C:\Users\aserg\OneDrive\Documentos\GitHub\VC\P4\RT-DETR\rtdetr_pytorch\configs\rtdetr\rtdetr_r50vd_6x_coco.yml
task: detection
num_classes: 2
remap_mscoco_category: false
train_dataloader:
  dataset:
    img_folder: C:\datasets\plates\train\images
    ann_file: C:\datasets\plates\train\_coco.json
  batch_size: 4
  num_workers: 4
  persistent_workers: true
val_dataloader:
  dataset:
    img_folder: C:\datasets\plates\val\images
    ann_file: C:\datasets\plates\val\_coco.json
  batch_size: 4
  num_workers: 4
  persistent_workers: true
output_dir: ./output/rtdetr_plate_ft_unfrozen
PResNet:
  pretrained: false
optimizer:
  type: AdamW
  params:
  - params: backbone
    lr: 1.0e-05
  - params: ^(?=.*encoder(?=.*bias|.*norm.*weight)).*$
    weight_decay: 0.0
  - params: ^(?=.*decoder(?=.*bias|.*norm.*weight)).*$
    weight_decay: 0.0
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 35
  gamma: 0.1
epoches: 40
